- pyenv:
  - tool for managing python versions. py version manager.
  - pyenv root is typically ~/.pyenv say pyenv_root
  - python versions are installed under $pyenv_root/versions
  - python packages are installed by pip under e.g. $pyenv_root/versions/3.11.5/lib/python3.11/site-packages
- pip:
  - package installer for python
  - installs packages from pypi.org (python package index)
  - may install packages from git, source distribution (sdist), wheel distribution
- pipenv:
  - tool to manage python virtualenvs
  - pip install --user pipenv # install under ~/.local/bin
  - virtual environments are created under ~/.local/share/virtualenvs # e.g. /home/user1/.local/share/virtualenvs/user1-dGCnura7
  - while pip manages package dependencies using requirements.txt, pipenv uses Pipfile. it is able to deal with package interdependencies in addition.

  - examples:
    - pipenv --python 3.10 # creates virtualenv with 3.10.x python
    - --venv # location of venv 
    - --rm # removes venv for the current folder
    - install --dev # install dependencies including development dependencies
- toml:
  - serialization format like json, yaml
  - tables are with headers e.g. [mytable]
  - key pairs are put as a=b
  - array of tables can be put under headling [[sources]] # e.g. {"sources": [{"name":"source1"}, {"name": "source2"}]} in json
- linux:
  - /dev/sda1 (scsi disk [a|b|c..z]n where n is partition number)
  - commands:
    - sh - default shell for the os. /usr/bin/sh
    - echo "date" | sh -s - --utc # -s to reinvoke the shell command. 
    # - or -- are same
    # -- simply signals the end of options and that any following tokens are arguments (not options) even if they start with a dash -.
    - dpkg -S /usr/bin/python3 # prints package that contains the given file
    - dpkg -l # list of packages
    - dpkg -L python3-minimal # list of files that belong to python3-minimal package
    - echo "item1 item2" | cut -d ' ' -f2 # prints item2
    - sudo -u user1 <cmd> # run command as user1
