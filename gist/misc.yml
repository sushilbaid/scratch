- zookeeper: 
  - apache open source project to provider coordination service for distributed application.
  - znodes:
    - each node can have data and children. think of this as file system where files can be directory as well.
    - ephemeral nodes are deleted once session that created it, is gone.
    - each node has version that is updated on updates. updates are atomic. node has acls.
    - client can add watch. means receive notification on znode change
  - apis:
    - create, delete, exists, get/set data, get children, sync
  - high on performance, availablility and strictly ordered access.
  - replicated over hosts called an ensemble
- waap - web application and api protection
- HCL - hashicorp configuration language
- libs:
  - libffi-dev foreign function interface provides calling convention abstraction for higher language impl.
  - libgmp-dev - gnu multi precision lib provides precision arithmetic on signed integers, rational numbers and floating point numbers.
  -  used mostly by math research, cypto, security projects
  - zlib1g-dev zlib provides impl of deflat compression method found in gzip and pkzip
  - libpq-dev headers and static lib for postgres db backend
  - libzookeeper-mt-dev multi threaded c binding for zookeeper
