apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ghost
spec: 
  replicas: 1
  selector:
    matchLabels:
      run: ghost
  template:
    metadata: 
      labels:
        run: ghost
    spec:
      containers: 
      - image: ghost
        name: ghost
        command:
        - sh
        - -c
        - cp /g-config/g-config.js /var/lib/ghost/config.js && /usr/local/bin/docker-entrypoint.sh node current/index.js
        volumeMounts:
        - mountPath: /g-config
          name: config
      volumes:
      - name: config
        configMap:
          name: g-config
          defaultMode: 420
              

  